groups:
  - name: trader-helper
    rules:
      - alert: TraderHelperDown
        expr: up{job="trader-helper"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Trader Helper metrics endpoint is unavailable

      - alert: TraderHelperOpenIncident
        expr: trader_helper_open_incidents > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Trader Helper has an active monitoring incident

      - alert: TraderHelperStaleProvider
        expr: trader_helper_provider_age_seconds > 420
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Market data provider has been stale for more than seven minutes

      - alert: TraderHelperDiskLow
        expr: (node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}) < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: VM root disk has less than 15 percent free space

      - alert: TraderHelperBackupIntegrityFailed
        expr: trader_helper_database_backup_integrity == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Trader Helper has no verified healthy database backup

      - alert: TraderHelperBackupStale
        expr: trader_helper_database_backup_age_seconds > 129600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Trader Helper database backup is older than 36 hours

      - alert: TraderHelperTradeNotificationFailure
        expr: increase(trader_helper_trade_notification_failures[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: A server-side trade notification failed
