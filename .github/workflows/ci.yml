name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check JavaScript
        run: |
          node --check app/app.js
          node --check app/market-core.js
          node --check app/pattern-engine.js
          node --test app/test_market_core.js app/test_pattern_engine.js

      - name: Check Python
        run: |
          python -m unittest discover -s app -p 'test_*.py'
          python -m py_compile app/server.py app/strategy_engine.py app/backtest_engine.py app/ibkr_provider.py
