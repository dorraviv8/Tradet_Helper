global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: trader-helper
    static_configs:
      - targets: [trader-helper:5173]
    metrics_path: /metrics

  - job_name: node-exporter
    static_configs:
      - targets: [node-exporter:9100]
